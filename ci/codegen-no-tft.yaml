# Upload-disabled variant of ci/codegen.yaml: full compile check for the
# -DDISABLE_NSPANEL_TFT_UPLOAD path (the C++ upload_tft method is only
# defined when USE_NSPANEL_TFT_UPLOAD is set, so the api service that
# calls it is omitted here). All entities are fictional; do not flash.

esphome:
  name: nspanel-codegen-no-tft
  comment: "CI codegen fixture (no TFT upload)"
  build_path: ./build/ci-codegen-no-tft
  build_flags:
    - -DDISABLE_NSPANEL_TFT_UPLOAD

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [nspanel_lovelace]

nspanel_lovelace:
  id: nspanel
  sleep_timeout: 10
  locale:
    language: fixtures/translation.json
  screensaver:
    time_id: homeassistant_time
    weather:
      entity_id: weather.demo_codegen
      forecast_method: service
    status_icon_left:
      entity_id: light.demo_left
      icon:
        value: hiking
        color: 0
      alt_font: true
    status_icon_right:
      entity_id: binary_sensor.demo_right
      icon: alert-circle-outline
  cards:
    - type: cardGrid
      id: main_card
      title: Main
      sleep_timeout: 65
      entities:
        - entity_id: light.kitchen
          icon: hiking
        - entity_id: navigate.hidden_card
        - entity_id: delete
        - entity_id: iText.Hello

    - type: cardGrid
      id: hidden_card
      hidden: true
      entities:
        - entity_id: sensor.demo_hidden

    - type: cardGrid
      id: last_card
      title: Last
      entities:
        - entity_id: light.kitchen
          name: 'Kitchen "Main" \ west'
          icon: hiking

logger:
  baud_rate: 115200

wifi:
  ssid: 'CODEGEN_SSID'
  password: 'CODEGEN_PASSWORD'

api:
  # A user-defined api service must exist so ESPHome defines
  # USE_API_USER_DEFINED_ACTIONS: with forecast_method 'service' the
  # component's C++ calls api's register_service(). The enabled variant's
  # upload_tft service is omitted here - that C++ method only exists when
  # USE_NSPANEL_TFT_UPLOAD is set.
  services:
    - service: codegen_noop
      then:
        - lambda: ""

uart:
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/New_York
